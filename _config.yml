# site settings
title: XploreZest
subtitle: by Xiaowen Zhang
email: xplorezest@gmail.com
description: A space for you to feel seen, valued, and at ease in who you are.
baseurl: "" # the subpath of your site, e.g. /blog
url: https://xplorezest.com # the base hostname & protocol for your site

# homepage tiles
tiles-source: pages # accepts "posts" or "pages"
tiles-count: 6

# social settings (key must match name of font awesome icon)
# see https://fontawesome.com/icons?d=gallery&p=2&s=brands
# Icons are not shown if value is empty
# You need to restart jekyll for changes to have an effect
socials:
  # LinkedIn: https://www.linkedin.com/in/xiaowenzhang

# build settings
markdown: kramdown

sass:
  style: compressed

plugins:
  - jekyll-timeago
  - jekyll-sitemap

exclude:
- "*.gemspec"
- LICENSE.md
- CONTRIBUTING.md
- README.md 
